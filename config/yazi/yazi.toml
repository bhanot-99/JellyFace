# JellyFace defaults for the yazi file manager (installed by scripts/yazi.sh; colours come from theme.toml, which
# scripts/theme.py writes from the shell's scheme). Anything not set here keeps yazi's own default.
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 4 ]     # parent | current | a wider preview
sort_by        = "natural"       # file2 before file10
sort_dir_first = true
linemode       = "size"
show_symlink   = true
scrolloff      = 6

[preview]
wrap          = "no"
tab_size      = 4
max_width     = 1600             # Kitty shows real pixels: render previews sharper than the 600x900 default
max_height    = 1600
image_delay   = 20               # ms to wait before drawing an image, so scrolling quickly stays smooth
image_filter  = "lanczos3"
image_quality = 90
