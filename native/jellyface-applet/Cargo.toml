[package]
name = "jellyface-applet"
version = "0.1.0"
edition = "2021"
description = "JellyFace menu as a native COSMIC panel applet"

[dependencies]
serde_json = "1"

[dependencies.libcosmic]
# libcosmic for the panel applet (tools/cosmic-theme pins a different commit: it only needs the theme crates, which
# have to match the installed COSMIC's config format). Cargo.lock keeps both reproducible; builds use --locked.
git = "https://github.com/pop-os/libcosmic"
rev = "adb3e34"
default-features = false
features = ["applet"]

[profile.release]
opt-level = "s"
lto = true
strip = true


